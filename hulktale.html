<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HULKTALE — GameHub</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080a0d;color:#fff;font-family:monospace;display:grid;place-items:center;min-height:100vh;padding:14px}
main{width:min(960px,100%)}h1{color:#65ef58;text-align:center;letter-spacing:5px;margin:5px 0 12px}p{color:#bbc6bb;text-align:center;margin:8px}
canvas{display:block;width:100%;height:auto;max-height:72vh;object-fit:contain;background:#000;border:4px solid #ddd;image-rendering:pixelated;touch-action:none}
#controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px auto}button{background:#151515;color:#ffe65b;border:2px solid #ffe65b;padding:10px 16px;font:bold 15px monospace;cursor:pointer}button:hover{background:#303020}.note{font-size:12px}
</style></head>
<body><main><h1>HULKTALE</h1><p>An unofficial, silly pixel-RPG fan parody. Hulk has fallen into the Underground.</p>
<canvas id="game" width="640" height="480" aria-label="HULKTALE game"></canvas>
<div id="controls"><button data-key="ArrowUp">▲</button><button data-key="ArrowLeft">◀</button><button data-key="ArrowDown">▼</button><button data-key="ArrowRight">▶</button><button data-key="z">Z / Confirm</button><button data-key="x">X / Back</button></div>
<p class="note">Move: WASD / arrow keys · Confirm: Z or Enter · Back: X or Escape · In battles, choose FIGHT, ACT, ITEM, or MERCY.</p>
</main>
<script>
(()=>{'use strict';
const c=document.querySelector('#game'),g=c.getContext('2d');g.imageSmoothingEnabled=false;
const keys={};let scene='title',room=0,dialog=null,step=0,hp=60,enemyHp=18,turn=0,menu=0,bullet=[],soul={x:320,y:320,inv:0},last=0,elapsed=0,ending='';
const lines=[
['FLOWEY','Howdy! I’m FLOWEY. FLOWEY the Flower!'],
['HULK','HULK NOT FLOWER. HULK SMASH FLOWER POT.'],
['FLOWEY','You’re new here, huh? Let me teach you about friendship!'],
['NARRATOR','A tiny glowing heart appears. Hulk attempts to eat it. The heart dodges.'],
['TORIEL','What an awful little weed! Hello, my child. I am Toriel.'],
['HULK','HULK NOT CHILD. HULK IS VERY LARGE ADULT.'],
['TORIEL','I will guide you through the RUINS. Please do not punch the walls.'],
['SANS','heya. name’s sans. sans the skeleton.'],
['HULK','HULK. HULK LIKES YOUR LACK OF MUSCLES.'],
['SANS','heh. that’s the nicest insult i’ve gotten all week.'],
['PAPYRUS','HUMAN! I, THE GREAT PAPYRUS, WILL CAPTURE YOU!'],
['HULK','HULK NOT HUMAN. HULK IS HULK.'],
['PAPYRUS','...I DID NOT PREPARE FOR THIS POSSIBILITY. NYEH HEH HEH!'],
['NARRATOR','Papyrus offers you a plate of spaghetti. Hulk eats the plate, too.'],
];
function rect(x,y,w,h,col){g.fillStyle=col;g.fillRect(x,y,w,h)}
function text(t,x,y,size=20,col='#fff',align='left'){g.fillStyle=col;g.font=size+'px monospace';g.textAlign=align;g.fillText(t,x,y)}
function box(x,y,w,h){rect(x,y,w,h,'#fff');rect(x+4,y+4,w-8,h-8,'#000')}
function heart(x,y,col='#49ff55'){g.fillStyle=col;g.beginPath();g.moveTo(x,y+8);g.bezierCurveTo(x-18,y-2,x-10,y-13,x,y-5);g.bezierCurveTo(x+10,y-13,x+18,y-2,x,y+8);g.fill()}
function actor(name,x,y,s=1){g.save();g.translate(x,y);g.scale(s,s);
 if(name==='HULK'){rect(-13,-31,26,26,'#5acb46');rect(-18,-13,36,19,'#5acb46');rect(-24,-10,8,20,'#5acb46');rect(16,-10,8,20,'#5acb46');rect(-12,6,9,14,'#553b7c');rect(4,6,9,14,'#553b7c');rect(-10,-38,20,10,'#5acb46');rect(-8,-34,4,3,'#fff');rect(4,-34,4,3,'#fff');}
 if(name==='FLOWEY'){rect(-3,-2,6,30,'#328b3e');for(let i=0;i<8;i++){g.fillStyle=i%2?'#ffd92c':'#fff15a';g.beginPath();g.ellipse(Math.cos(i*Math.PI/4)*13,Math.sin(i*Math.PI/4)*13-16,7,10,i*Math.PI/4,0,7);g.fill()}g.fillStyle='#a52c37';g.beginPath();g.arc(0,-16,9,0,7);g.fill();rect(-5,-18,3,3,'#000');rect(3,-18,3,3,'#000');}
 if(name==='TORIEL'){rect(-17,-24,34,40,'#f2edf5');rect(-13,-42,26,22,'#eee6d8');rect(-12,-32,5,5,'#7a2032');rect(7,-32,5,5,'#7a2032');rect(-18,12,36,9,'#7445a5');}
 if(name==='SANS'){rect(-18,-24,36,30,'#eee');rect(-16,-34,32,13,'#3b63bb');rect(-10,-17,6,7,'#000');rect(5,-17,6,7,'#000');rect(-9,-2,18,3,'#000');}
 if(name==='PAPYRUS'){rect(-15,-28,30,34,'#fff');rect(-18,-38,36,13,'#fff');rect(-10,-21,6,7,'#000');rect(5,-21,6,7,'#000');rect(-20,7,40,8,'#e74a24');}
 g.restore()}
function startDialog(arr,next){dialog={arr:arr.map(x=>[...x]),index:0,next};}
function advance(){if(!dialog)return;if(dialog.index<dialog.arr.length-1)dialog.index++;else{const n=dialog.next;dialog=null;if(n)n()}}
function drawDialog(){if(!dialog)return;box(22,332,596,126);const [who,line]=dialog.arr[dialog.index];if(who!=='NARRATOR')actor(who,70,385,.75);text((who==='NARRATOR'?'* ':who+': ')+line,who==='NARRATOR'?42:120,365,16);text('Z / ENTER ▶',590,438,13,'#ffe65b','right')}
function startBattle(which,next){scene='battle';ending=which;enemyHp=which==='FLOWEY'?18:which==='TORIEL'?30:24;hp=Math.min(60,hp);turn=0;menu=0;bullet=[];soul={x:320,y:315,inv:0};dialog=null;battleNext=next;}
let battleNext=()=>{};
function worldDraw(){rect(0,0,640,480,room===2?'#10203a':'#130d1a');rect(0,210,640,270,room===2?'#e2edf7':'#30213c');for(let i=0;i<9;i++){if(room===2){g.fillStyle='#214f3b';g.beginPath();g.moveTo(i*80,220);g.lineTo(i*80+40,95+(i%3)*12);g.lineTo(i*80+80,220);g.fill()}else{rect(i*76+10,215,9,24,'#2b6339');rect(i*76+3,212,24,9,'#4b9b42')}}actor(room===0?'FLOWEY':room===1?'TORIEL':step<3?'SANS':'PAPYRUS',room===0?320:room===1?500:470,290,1.25);actor('HULK',player.x,player.y,1.1);text(room===0?'THE RUINS':room===1?'TORIEL’S HOME':'SNOWDIN FOREST',20,32,18,'#ffe65b');if(dialog)drawDialog();else{text('Find the character and press Z.',22,440,16)}}
const player={x:100,y:380};
function updateWorld(dt){if(dialog)return;const sp=keys.Shift?220:145;let dx=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0),dy=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0);if(dx||dy){const n=Math.hypot(dx,dy);player.x=Math.max(32,Math.min(608,player.x+dx/n*sp*dt));player.y=Math.max(245,Math.min(430,player.y+dy/n*sp*dt))}
 if(keys.z||keys.Enter){keys.z=keys.Enter=false;if(room===0&&!step){step=1;startDialog(lines.slice(0,4),()=>startBattle('FLOWEY',()=>{room=1;player.x=90;startDialog(lines.slice(4,7),()=>{});}))}else if(room===1&&!step){step=2;startDialog([['TORIEL','I made a pie. Please do not eat the plate.'],['HULK','HULK MAKES NO PROMISES.']],()=>startBattle('TORIEL',()=>{room=2;player.x=80;startDialog(lines.slice(7,10),()=>{});}));}else if(room===2&&step===2){step=3;startDialog(lines.slice(10,14),()=>startBattle('PAPYRUS',()=>{scene='end'}));}else if(dialog)advance();else if(room===2){startDialog([['SANS','press z to progress. that’s the whole tutorial.']],()=>{});}}
}
function battleDraw(dt){rect(0,0,640,480,'#000');actor(ending,320,110,2.3);text(ending+' blocks the way!',320,210,19,'#fff','center');box(32,240,576,130);
 if(dialog){drawDialog();return}
 if(scene!=='battle')return;
 if(battleState==='dodge'){soul.x=Math.max(45,Math.min(595,soul.x+((keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0))*200*dt));soul.y=Math.max(252,Math.min(357,soul.y+((keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0))*200*dt));for(const b of bullet){b.x+=b.vx*dt;b.y+=b.vy*dt;if(!soul.inv&&Math.hypot(b.x-soul.x,b.y-soul.y)<11){hp-=4;soul.inv=.6}}bullet=bullet.filter(b=>b.x>20&&b.x<620&&b.y>220&&b.y<390);if(Math.random()<dt*2.3)bullet.push({x:40+Math.random()*560,y:245,vx:(Math.random()-.5)*50,vy:70+Math.random()*45});for(const b of bullet){rect(b.x-4,b.y-4,8,8,'#fff')}heart(soul.x,soul.y);if(soul.inv>0)soul.inv-=dt;dodgeTime-=dt;text('DODGE! Move with arrows.',320,410,16,'#ffe65b','center');if(dodgeTime<=0){battleState='menu';bullet=[];turn++}}
 else {text('* '+(ending==='FLOWEY'?'Flowey is smiling suspiciously.':ending==='TORIEL'?'Toriel looks worried.':'Papyrus is flexing dramatically.'),52,275,16);text('HULK  LV 1',32,395,18);text('HP',220,395,18);rect(255,379,120,18,'#8b1919');rect(255,379,Math.max(0,120*hp/60),18,'#50e54d');text(hp+' / 60',390,395,17);['FIGHT','ACT','ITEM','MERCY'].forEach((v,i)=>text((menu===i?'♥ ':'  ')+v,42+i*145,445,19,menu===i?'#ffe65b':'#ff9b37'));text('← → choose · Z confirm',320,465,13,'#aaa','center')}
}
let battleState='menu',dodgeTime=0;
function battleInput(){if(dialog){advance();return}if(battleState==='menu'){menu=(menu+(keys.ArrowRight||keys.d?1:keys.ArrowLeft||keys.a?-1:0)+4)%4;if(keys.z||keys.Enter){keys.z=keys.Enter=false;if(menu===0){enemyHp-=ending==='FLOWEY'?9:4;startDialog([['HULK','HULK SWINGS. '+(ending==='FLOWEY'?'FLOWER DODGES.':'EVERYONE IS VERY IMPRESSED.')]],()=>{if(enemyHp<=0){scene='world';battleNext()}else{battleState='dodge';dodgeTime=3.5;soul.x=320;soul.y=310;}})}else if(menu===1)startDialog([['HULK',ending==='FLOWEY'?'HULK SAYS FLOWER NEEDS SUNLIGHT.':'HULK OFFERS A VERY GENTLE HIGH-FIVE.']],()=>{battleState='dodge';dodgeTime=3.5});else if(menu===2){hp=Math.min(60,hp+18);startDialog([['HULK','HULK EATS A GAMMA GUMMY. HP RESTORED.']],()=>{battleState='dodge';dodgeTime=3.5})}else{startDialog([['NARRATOR','Hulk attempts mercy. It is surprisingly effective.']],()=>{scene='world';battleNext()})}}}}
function drawTitle(){rect(0,0,640,480,'#000');actor('HULK',320,190,3.3);text('HULKTALE',320,290,60,'#5bed4d','center');text('A VERY GREEN RPG',320,325,20,'#fff','center');if(Math.floor(elapsed*2)%2)text('PRESS Z / ENTER',320,380,20,'#ffe65b','center');text('An unofficial fan parody',320,440,14,'#777','center')}
function frame(ts){const dt=Math.min(.04,(ts-last)/1000||0);last=ts;elapsed+=dt;try{if(scene==='title'){drawTitle();if(keys.z||keys.Enter){keys.z=keys.Enter=false;scene='world';room=0;step=0;player.x=100;player.y=380;startDialog([['NARRATOR','Long ago, monsters were sealed underground. Today, Hulk fell in.'],['HULK','HOLE RUDE.']],()=>{})}}else if(scene==='world'){worldDraw();updateWorld(dt)}else if(scene==='battle'){battleDraw(dt);if(!dialog)battleInput();if(hp<=0){hp=60;scene='over'}}else if(scene==='over'){rect(0,0,640,480,'#000');text('HULK NEEDS A SNACK.',320,220,30,'#fff','center');text('Press Z to try again.',320,280,20,'#ffe65b','center');if(keys.z||keys.Enter){keys.z=keys.Enter=false;scene='battle';battleState='menu';}}else if(scene==='end'){rect(0,0,640,480,'#000');actor('HULK',320,170,2.4);text('TO BE CONTINUED...',320,260,34,'#5bed4d','center');text('Hulk made friends. Hulk ate a plate.',320,305,17,'#fff','center');text('Press Z to return to title.',320,390,17,'#ffe65b','center');if(keys.z||keys.Enter){keys.z=keys.Enter=false;scene='title';room=0;step=0;hp=60}}}catch(e){console.error(e);rect(0,0,640,480,'#000');text('Game error. Reload the page.',320,240,20,'#fff','center')}requestAnimationFrame(frame)}
window.addEventListener('keydown',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(!keys[k]){if(scene==='battle'&&k==='z')keys.z=true;else if(scene==='battle'&&k==='Enter')keys.Enter=true;else if(scene==='battle'&&k==='x'){if(dialog)dialog=null;else battleState='menu'}else keys[k]=true;}});
window.addEventListener('keyup',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;keys[k]=false});
document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key==='z'?'z':b.dataset.key==='x'?'x':b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;if(scene==='battle'&&k==='z')keys.z=true});b.addEventListener('pointerup',()=>keys[k]=false);b.addEventListener('pointerleave',()=>keys[k]=false)});
requestAnimationFrame(frame);
})();
</script></body></html>
